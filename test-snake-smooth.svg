<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 1100' width='800' height='1100'>
  <defs>
    <linearGradient id='snakeGrad' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stopColor='#FF4500' />
      <stop offset='15%' stopColor='#F43F5E' />
      <stop offset='38%' stopColor='#C026D3' />
      <stop offset='65%' stopColor='#7C3AED' />
      <stop offset='85%' stopColor='#3B82F6' />
      <stop offset='100%' stopColor='#0284C7' />
    </linearGradient>
    <filter id='discShadow' x='-20%' y='-20%' width='150%' height='150%'>
      <feDropShadow dx='0' dy='8' stdDeviation='10' flood-color='#000000' flood-opacity='0.16' />
    </filter>
  </defs>
  
  <!-- Continuous S-Curve Snake Path -->
  <!-- Centers: (520, 180), (280, 440), (520, 700), (280, 960) -->
  <path d='M 520 180 C 520 310, 280 310, 280 440 C 280 570, 520 570, 520 700 C 520 830, 280 830, 280 960' 
        stroke='url(#snakeGrad)' stroke-width='170' stroke-linecap='round' fill='none' />
        
  <!-- Outer Node Circles for perfect circular caps -->
  <circle cx='520' cy='180' r='98' fill='url(#snakeGrad)' />
  <circle cx='280' cy='440' r='98' fill='url(#snakeGrad)' />
  <circle cx='520' cy='700' r='98' fill='url(#snakeGrad)' />
  <circle cx='280' cy='960' r='98' fill='url(#snakeGrad)' />
  
  <!-- Inner White Discs with Drop Shadow -->
  <circle cx='520' cy='180' r='75' fill='#FFFFFF' filter='url(#discShadow)' />
  <circle cx='280' cy='440' r='75' fill='#FFFFFF' filter='url(#discShadow)' />
  <circle cx='520' cy='700' r='75' fill='#FFFFFF' filter='url(#discShadow)' />
  <circle cx='280' cy='960' r='75' fill='#FFFFFF' filter='url(#discShadow)' />
</svg>