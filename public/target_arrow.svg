<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <filter id="target-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
    <filter id="arrow-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="6" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Base white plate -->
  <circle cx="160" cy="160" r="142" fill="#FFFFFF" filter="url(#target-shadow)"/>
  
  <!-- Ring 1: Chartreuse / Lime (#C7D94C) -->
  <circle cx="160" cy="160" r="126" fill="#C7D94C"/>
  
  <!-- Ring 2: White -->
  <circle cx="160" cy="160" r="98" fill="#FFFFFF"/>
  
  <!-- Ring 3: Deep Dark Charcoal/Teal (#1A2E28) -->
  <circle cx="160" cy="160" r="78" fill="#1A2E28"/>
  
  <!-- Ring 4: White -->
  <circle cx="160" cy="160" r="50" fill="#FFFFFF"/>
  
  <!-- Ring 5: Center Bullseye Dark -->
  <circle cx="160" cy="160" r="28" fill="#1A2E28"/>

  <!-- Arrow Shaft Cast Shadow -->
  <line x1="164" y1="164" x2="242" y2="86" stroke="rgba(0,0,0,0.25)" stroke-width="6" stroke-linecap="round"/>

  <!-- Arrow Shaft -->
  <line x1="160" y1="160" x2="238" y2="82" stroke="#262626" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Arrow Fletching / Feathers -->
  <g transform="translate(238, 82) rotate(45)" filter="url(#arrow-shadow)">
    <!-- Feather profile -->
    <path d="M0,0 L-10,-22 L-28,-22 L-16,0 L-28,22 L-10,22 Z" fill="#182420"/>
    <!-- White texture stripes on feathers -->
    <line x1="-7" y1="-18" x2="-11" y2="0" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-13" y1="-20" x2="-17" y2="0" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-19" y1="-21" x2="-23" y2="0" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-7" y1="18" x2="-11" y2="0" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-13" y1="20" x2="-17" y2="0" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-19" y1="21" x2="-23" y2="0" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Nock end -->
    <rect x="-3" y="-3" width="6" height="6" rx="1.5" fill="#111827"/>
  </g>

  <!-- Point of impact in bullseye with highlight -->
  <circle cx="160" cy="160" r="4.5" fill="#111827"/>
  <ellipse cx="158.5" cy="161.5" rx="2" ry="1.2" fill="#FFFFFF" opacity="0.6"/>
</svg>
